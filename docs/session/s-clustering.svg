<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950"><rect width="1700" height="950" fill="#FBF7F2"/><text x="60" y="58" font-family="Arial" font-size="15" font-weight="700" fill="#E2574C" text-anchor="start" letter-spacing="2">CHAPTER FIVE · NOBODY WROTE A FUNCTION CALLED FINDPEOPLE()</text><text x="60" y="104" font-family="Arial" font-size="34" font-weight="700" fill="#2A1B3D" text-anchor="start">Each face asks one question, and people fall out</text><rect x="84" y="171" width="700" height="104" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="80" y="165" width="700" height="104" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="132" cy="217" r="26" fill="#E2574C"/><g transform="translate(117.05 202.05) scale(1.2458333333333333)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/></g><text x="180" y="211" font-family="Arial" font-size="22" font-weight="700" fill="#2A1B3D" text-anchor="start">A new face appears</text><text x="180" y="241" font-family="Arial" font-size="15" font-weight="400" fill="#7C6B84" text-anchor="start">It has 512 numbers and no name.</text><line x1="430" y1="273" x2="430" y2="285.1" stroke="#D9CDC2" stroke-width="3" stroke-linecap="round"/><polygon points="430,295 425.05,285.1 434.95,285.1" fill="#D9CDC2"/><rect x="84" y="309" width="700" height="104" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="80" y="303" width="700" height="104" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="132" cy="355" r="26" fill="#E2574C"/><g transform="translate(117.05 340.05) scale(1.2458333333333333)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 18.5a7.5 7.5 0 1 0 0-15 7.5 7.5 0 0 0 0 15z M16.5 16.5 21 21"/></g><text x="180" y="349" font-family="Arial" font-size="22" font-weight="700" fill="#2A1B3D" text-anchor="start">It looks around</text><text x="180" y="379" font-family="Arial" font-size="15" font-weight="400" fill="#7C6B84" text-anchor="start">Every face in this event within 0.5.</text><line x1="430" y1="411" x2="430" y2="423.1" stroke="#D9CDC2" stroke-width="3" stroke-linecap="round"/><polygon points="430,433 425.05,423.1 434.95,423.1" fill="#D9CDC2"/><rect x="80" y="441" width="700" height="116" rx="18" fill="#2A1B3D" stroke="none" stroke-width="2"/><text x="430" y="491" font-family="Arial" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Does a close neighbour already</text><text x="430" y="523" font-family="Arial" font-size="22" font-weight="700" fill="#F2A93B" text-anchor="middle">belong to somebody?</text><path d="M 260 557 L 260 611 L 220 611" fill="none" stroke="#2E7D77" stroke-width="3.5"/><line x1="220" y1="611" x2="220" y2="625.5" stroke="#2E7D77" stroke-width="3.5" stroke-linecap="round"/><polygon points="220,639 213.25,625.5 226.75,625.5" fill="#2E7D77"/><text x="276" y="597" font-family="Arial" font-size="17" font-weight="700" fill="#2E7D77" text-anchor="start">YES</text><rect x="84" y="653" width="320" height="138" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="80" y="647" width="320" height="138" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="128" cy="705" r="22" fill="#2E7D77"/><g transform="translate(115.35 692.35) scale(1.0541666666666665)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z M2.5 20.5c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6 M16.5 5.2a3.4 3.4 0 0 1 0 6.6 M17.5 14.8c2.4.6 4 2.6 4 5.7"/></g><text x="168" y="713" font-family="Arial" font-size="21" font-weight="700" fill="#2A1B3D" text-anchor="start">Join them</text><text x="108" y="753" font-family="Arial" font-size="14" font-weight="400" fill="#7C6B84" text-anchor="start">No new person. The face is</text><text x="108" y="773" font-family="Arial" font-size="14" font-weight="400" fill="#7C6B84" text-anchor="start">simply added.</text><path d="M 600 557 L 600 611 L 640 611" fill="none" stroke="#E2574C" stroke-width="3.5"/><line x1="640" y1="611" x2="640" y2="625.5" stroke="#E2574C" stroke-width="3.5" stroke-linecap="round"/><polygon points="640,639 633.25,625.5 646.75,625.5" fill="#E2574C"/><text x="584" y="597" font-family="Arial" font-size="17" font-weight="700" fill="#E2574C" text-anchor="end">NO</text><rect x="464" y="653" width="320" height="138" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="460" y="647" width="320" height="138" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="508" cy="705" r="22" fill="#E2574C"/><g transform="translate(495.35 692.35) scale(1.0541666666666665)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/></g><text x="548" y="713" font-family="Arial" font-size="21" font-weight="700" fill="#2A1B3D" text-anchor="start">Start a new one</text><text x="488" y="753" font-family="Arial" font-size="14" font-weight="400" fill="#7C6B84" text-anchor="start">This face becomes person number</text><text x="488" y="773" font-family="Arial" font-size="14" font-weight="400" fill="#7C6B84" text-anchor="start">N+1.</text><text x="80" y="906" font-family="Arial" font-size="18" font-weight="400" fill="#7A4E8C" text-anchor="start" font-style="italic">A “person” is not detected. It is what is left over once every face has answered that one question.</text><rect x="844" y="156" width="800" height="218" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="840" y="150" width="800" height="218" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="900" cy="218" r="24" fill="#E2574C"/><g transform="translate(886.2 204.2) scale(1.15)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 7v5.4l3.4 2"/></g><text x="944" y="226" font-family="Arial" font-size="22" font-weight="700" fill="#2A1B3D" text-anchor="start">The trap</text><text x="876" y="278" font-family="Arial" font-size="16" font-weight="400" fill="#7C6B84" text-anchor="start">Faces are judged as they arrive — so the first face has nobody to compare</text><text x="876" y="304" font-family="Arial" font-size="16" font-weight="400" fill="#7C6B84" text-anchor="start">against yet. Not because it is alone, but because its neighbours have not</text><text x="876" y="330" font-family="Arial" font-size="16" font-weight="400" fill="#7C6B84" text-anchor="start">been measured.</text><rect x="844" y="394" width="800" height="218" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="840" y="388" width="800" height="218" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="900" cy="456" r="24" fill="#F2A93B"/><g transform="translate(886.2 442.2) scale(1.15)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></g><text x="944" y="464" font-family="Arial" font-size="22" font-weight="700" fill="#2A1B3D" text-anchor="start">Safeguard · the second pass</text><text x="876" y="516" font-family="Arial" font-size="16" font-weight="400" fill="#7C6B84" text-anchor="start">A face with too few neighbours is put back in the queue and asked again</text><text x="876" y="542" font-family="Arial" font-size="16" font-weight="400" fill="#7C6B84" text-anchor="start">later, once the confident faces have created people. Order of arrival must</text><text x="876" y="568" font-family="Arial" font-size="16" font-weight="400" fill="#7C6B84" text-anchor="start">not decide who you are.</text><rect x="844" y="632" width="800" height="218" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="840" y="626" width="800" height="218" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="900" cy="694" r="24" fill="#2E7D77"/><g transform="translate(886.2 680.2) scale(1.15)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 20 6v6c0 5-3.4 8.4-8 9.5-4.6-1.1-8-4.5-8-9.5V6z M9 12l2.2 2.2L15.5 10"/></g><text x="944" y="702" font-family="Arial" font-size="22" font-weight="700" fill="#2A1B3D" text-anchor="start">Safeguard · minFaces</text><text x="876" y="754" font-family="Arial" font-size="16" font-weight="400" fill="#7C6B84" text-anchor="start">How many faces must agree before a person may exist at all. Default 1 — at</text><text x="876" y="780" font-family="Arial" font-size="16" font-weight="400" fill="#7C6B84" text-anchor="start">a small event a real guest may genuinely appear in exactly one photo.</text></svg>