<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950"><rect width="1700" height="950" fill="#FBF7F2"/><text x="60" y="58" font-family="Arial" font-size="15" font-weight="700" fill="#E2574C" text-anchor="start" letter-spacing="2">CHAPTER SIX · TWO MACHINES, ONE OF THEM EXPENSIVE</text><text x="60" y="104" font-family="Arial" font-size="34" font-weight="700" fill="#2A1B3D" text-anchor="start">The queue is what lets the costly one disappear</text><rect x="64" y="166" width="740" height="400" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="60" y="160" width="740" height="400" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="116" cy="216" r="24" fill="#E2574C"/><g transform="translate(102.2 202.2) scale(1.15)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.5h17v6h-17z M3.5 13.5h17v6h-17z M7 7.5h.2 M7 16.5h.2"/></g><text x="160" y="210" font-family="Arial" font-size="24" font-weight="700" fill="#2A1B3D" text-anchor="start">The always-on box</text><text x="160" y="238" font-family="Arial" font-size="14" font-weight="400" fill="#7C6B84" text-anchor="start">Render · cheap · no GPU · EL_WORKERS_INCLUDE=api,ingest</text><rect x="92" y="278" width="676" height="76" rx="12" fill="#F3EBE2" stroke="none" stroke-width="2"/><text x="118" y="310" font-family="Arial" font-size="17" font-weight="700" fill="#2A1B3D" text-anchor="start">The REST API</text><text x="118" y="334" font-family="Arial" font-size="14" font-weight="400" fill="#7C6B84" text-anchor="start">auth, uploads, events, the admin panel</text><rect x="92" y="366" width="676" height="76" rx="12" fill="#F3EBE2" stroke="none" stroke-width="2"/><text x="118" y="398" font-family="Arial" font-size="17" font-weight="700" fill="#2A1B3D" text-anchor="start">Cron and ingest workers</text><text x="118" y="422" font-family="Arial" font-size="14" font-weight="400" fill="#7C6B84" text-anchor="start">clustering, sweeps, retention</text><rect x="92" y="454" width="676" height="76" rx="12" fill="#F3EBE2" stroke="none" stroke-width="2"/><text x="118" y="486" font-family="Arial" font-size="17" font-weight="700" fill="#2A1B3D" text-anchor="start">The lifecycle sweep</text><text x="118" y="510" font-family="Arial" font-size="14" font-weight="400" fill="#7C6B84" text-anchor="start">every two minutes: start, stop, or do nothing</text><rect x="900" y="160" width="740" height="400" rx="18" fill="#2A1B3D" stroke="none" stroke-width="2"/><circle cx="956" cy="216" r="24" fill="#F2A93B"/><g transform="translate(942.2 202.2) scale(1.15)" fill="none" stroke="#2A1B3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10H7z M9.5 2.5V7 M14.5 2.5V7 M9.5 17v4.5 M14.5 17v4.5 M2.5 9.5H7 M2.5 14.5H7 M17 9.5h4.5 M17 14.5h4.5"/></g><text x="1000" y="210" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="start">The box that costs money</text><text x="1000" y="238" font-family="Arial" font-size="14" font-weight="400" fill="#C9BBD6" text-anchor="start">JarvisLabs · billed per second · EL_WORKERS_INCLUDE=media</text><rect x="932" y="278" width="676" height="76" rx="12" fill="#3A2A50" stroke="none" stroke-width="2"/><text x="958" y="310" font-family="Arial" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">The same image, different role</text><text x="958" y="334" font-family="Arial" font-size="14" font-weight="400" fill="#C9BBD6" text-anchor="start">pulls GPU jobs, talks to the sidecar</text><rect x="932" y="366" width="676" height="76" rx="12" fill="#3A2A50" stroke="none" stroke-width="2"/><text x="958" y="398" font-family="Arial" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">The ML sidecar</text><text x="958" y="422" font-family="Arial" font-size="14" font-weight="400" fill="#C9BBD6" text-anchor="start">RetinaFace · ArcFace · CLIP, on CUDA</text><rect x="932" y="454" width="676" height="76" rx="12" fill="#3A2A50" stroke="none" stroke-width="2"/><text x="958" y="486" font-family="Arial" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Its own suicide switch</text><text x="958" y="510" font-family="Arial" font-size="14" font-weight="400" fill="#C9BBD6" text-anchor="start">polls the API and shuts itself down</text><line x1="896" y1="300" x2="819.5" y2="300" stroke="#2E7D77" stroke-width="3.5" stroke-linecap="round"/><polygon points="806,300 819.5,293.25 819.5,306.75" fill="#2E7D77"/><text x="850" y="284" font-family="Arial" font-size="14" font-weight="700" fill="#2E7D77" text-anchor="middle">heartbeat</text><path d="M 804 420 L 850 420 L 850 470" fill="none" stroke="#F2A93B" stroke-width="3.5" stroke-dasharray="9 7"/><line x1="850" y1="462" x2="850" y2="464.3" stroke="#F2A93B" stroke-width="3.5" stroke-linecap="round"/><polygon points="850,476 844.15,464.3 855.85,464.3" fill="#F2A93B"/><path d="M 850 476 L 850 500 L 896 500" fill="none" stroke="#F2A93B" stroke-width="3.5" stroke-dasharray="9 7"/><line x1="886" y1="500" x2="886.3" y2="500" stroke="#F2A93B" stroke-width="3.5" stroke-linecap="round"/><polygon points="898,500 886.3,505.85 886.3,494.15" fill="#F2A93B"/><text x="850" y="384" font-family="Arial" font-size="14" font-weight="700" fill="#F2A93B" text-anchor="middle">jl pause</text><text x="850" y="404" font-family="Arial" font-size="14" font-weight="700" fill="#F2A93B" text-anchor="middle">jl resume</text><text x="60" y="622" font-family="Arial" font-size="13" font-weight="700" fill="#7C6B84" text-anchor="start" letter-spacing="1.4">BETWEEN THEM, AND OWNED BY NEITHER</text><rect x="64" y="656" width="513" height="130" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="60" y="650" width="513" height="130" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="126" cy="716" r="27" fill="#7A4E8C"/><g transform="translate(110.475 700.475) scale(1.29375)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16 M4 12h16 M4 18h10"/></g><text x="176" y="706" font-family="Arial" font-size="21" font-weight="700" fill="#2A1B3D" text-anchor="start">Redis + BullMQ</text><text x="176" y="734" font-family="Arial" font-size="14" font-weight="400" fill="#7C6B84" text-anchor="start">the job queue — the real decoupler</text><rect x="597" y="656" width="513" height="130" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="593" y="650" width="513" height="130" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="659" cy="716" r="27" fill="#2E7D77"/><g transform="translate(643.475 700.475) scale(1.29375)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7.6c4.4 0 8-1.2 8-2.8S16.4 2 12 2 4 3.2 4 4.8s3.6 2.8 8 2.8z M20 4.8v14.4c0 1.6-3.6 2.8-8 2.8s-8-1.2-8-2.8V4.8 M20 12c0 1.6-3.6 2.8-8 2.8S4 13.6 4 12"/></g><text x="709" y="706" font-family="Arial" font-size="21" font-weight="700" fill="#2A1B3D" text-anchor="start">Postgres + pgvector</text><text x="709" y="734" font-family="Arial" font-size="14" font-weight="400" fill="#7C6B84" text-anchor="start">512-d vectors, fenced by event</text><rect x="1130" y="656" width="513" height="130" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="1126" y="650" width="513" height="130" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="1192" cy="716" r="27" fill="#E2574C"/><g transform="translate(1176.475 700.475) scale(1.29375)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .4-7.98A6 6 0 0 0 5.8 11.2 3.4 3.4 0 0 0 7 18z"/></g><text x="1242" y="706" font-family="Arial" font-size="21" font-weight="700" fill="#2A1B3D" text-anchor="start">Cloudflare R2</text><text x="1242" y="734" font-family="Arial" font-size="14" font-weight="400" fill="#7C6B84" text-anchor="start">originals, previews, thumbnails</text><rect x="60" y="812" width="1580" height="100" rx="16" fill="#F3EBE2" stroke="none" stroke-width="2"/><text x="92" y="856" font-family="Arial" font-size="20" font-weight="700" fill="#2A1B3D" text-anchor="start">The API never calls the GPU. It puts a job in Redis.</text><text x="92" y="888" font-family="Arial" font-size="16" font-weight="400" fill="#7C6B84" text-anchor="start">That one design choice is the reason the expensive machine is allowed to not exist for most of the month.</text></svg>