<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950"><rect width="1700" height="950" fill="#0E1330"/><text x="60" y="60" font-family="Arial" font-size="26" font-weight="400" fill="#8A93B8" text-anchor="start">One photo does not become one number. Every face in it becomes its own.</text><rect x="60" y="130" width="300" height="250" rx="14" fill="#141B3E" stroke="#4C6FFF" stroke-width="2"/><rect x="80" y="155" width="260" height="170" rx="8" fill="#20295C"/><circle cx="130" cy="205.9" r="10.92" fill="none" stroke="#3DD68C" stroke-width="3"/><path d="M 111.28 237.1 a 18.72 16.12 0 0 1 37.44 0" fill="none" stroke="#3DD68C" stroke-width="3"/><rect x="105.3" y="187.7" width="49.4" height="54.6" rx="4" fill="none" stroke="#3DD68C" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="215" cy="192.3" r="9.24" fill="none" stroke="#FFB020" stroke-width="3"/><path d="M 199.16 218.7 a 15.84 13.64 0 0 1 31.68 0" fill="none" stroke="#FFB020" stroke-width="3"/><rect x="194.1" y="176.9" width="41.8" height="46.2" rx="4" fill="none" stroke="#FFB020" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="285" cy="221.6" r="10.08" fill="none" stroke="#FF7AA8" stroke-width="3"/><path d="M 267.72 250.4 a 17.28 14.879999999999999 0 0 1 34.56 0" fill="none" stroke="#FF7AA8" stroke-width="3"/><rect x="262.2" y="204.8" width="45.599999999999994" height="50.400000000000006" rx="4" fill="none" stroke="#FF7AA8" stroke-width="2.5" stroke-dasharray="5 4"/><text x="210" y="358" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="middle">a group photo · 3 faces found</text><text x="75" y="116" font-family="Arial" font-size="14" font-weight="700" fill="#4C6FFF" text-anchor="start">INPUT</text><rect x="480" y="130" width="300" height="250" rx="14" fill="#141B3E" stroke="#FFB020" stroke-width="2"/><text x="495" y="116" font-family="Arial" font-size="14" font-weight="700" fill="#FFB020" text-anchor="start">RETINAFACE — detect, then align</text><rect x="504" y="170" width="72" height="90" rx="6" fill="#20295C" stroke="#3DD68C" stroke-width="2"/><circle cx="540" cy="211.5" r="12.6" fill="none" stroke="#3DD68C" stroke-width="3"/><path d="M 518.4 247.5 a 21.599999999999998 18.6 0 0 1 43.199999999999996 0" fill="none" stroke="#3DD68C" stroke-width="3"/><rect x="596" y="170" width="72" height="90" rx="6" fill="#20295C" stroke="#FFB020" stroke-width="2"/><circle cx="632" cy="211.5" r="12.6" fill="none" stroke="#FFB020" stroke-width="3"/><path d="M 610.4 247.5 a 21.599999999999998 18.6 0 0 1 43.199999999999996 0" fill="none" stroke="#FFB020" stroke-width="3"/><rect x="688" y="170" width="72" height="90" rx="6" fill="#20295C" stroke="#FF7AA8" stroke-width="2"/><circle cx="724" cy="211.5" r="12.6" fill="none" stroke="#FF7AA8" stroke-width="3"/><path d="M 702.4 247.5 a 21.599999999999998 18.6 0 0 1 43.199999999999996 0" fill="none" stroke="#FF7AA8" stroke-width="3"/><text x="500" y="302" font-family="Arial" font-size="14" font-weight="400" fill="#8A93B8" text-anchor="start">each face cropped out and rotated</text><text x="500" y="322" font-family="Arial" font-size="14" font-weight="400" fill="#8A93B8" text-anchor="start">so the eyes sit on the same line —</text><text x="500" y="342" font-family="Arial" font-size="14" font-weight="400" fill="#8A93B8" text-anchor="start">every crop 112 × 112 pixels</text><rect x="900" y="130" width="300" height="250" rx="14" fill="#141B3E" stroke="#A9BEFF" stroke-width="2"/><text x="915" y="116" font-family="Arial" font-size="14" font-weight="700" fill="#A9BEFF" text-anchor="start">ARCFACE (buffalo_l) — embed</text><rect x="920" y="168" width="260" height="44" rx="6" fill="#20295C" stroke="#3DD68C" stroke-width="1.5"/><text x="934" y="196" font-family="Courier New" font-size="15" font-weight="400" fill="#3DD68C" text-anchor="start">[ 0.041, -0.118, 0.207 … ]</text><rect x="920" y="226" width="260" height="44" rx="6" fill="#20295C" stroke="#FFB020" stroke-width="1.5"/><text x="934" y="254" font-family="Courier New" font-size="15" font-weight="400" fill="#FFB020" text-anchor="start">[ -0.118, 0.207, 0.003 … ]</text><rect x="920" y="284" width="260" height="44" rx="6" fill="#20295C" stroke="#FF7AA8" stroke-width="1.5"/><text x="934" y="312" font-family="Courier New" font-size="15" font-weight="400" fill="#FF7AA8" text-anchor="start">[ 0.207, 0.003, -0.076 … ]</text><text x="920" y="358" font-family="Arial" font-size="14" font-weight="400" fill="#8A93B8" text-anchor="start">512 decimals per face — always 512</text><rect x="1320" y="130" width="300" height="250" rx="14" fill="#141B3E" stroke="#3DD68C" stroke-width="2"/><text x="1335" y="116" font-family="Arial" font-size="14" font-weight="700" fill="#3DD68C" text-anchor="start">POSTGRES + pgvector</text><text x="1342" y="185" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">asset_face</text><text x="1342" y="220" font-family="Courier New" font-size="14" font-weight="400" fill="#8A93B8" text-anchor="start">id</text><text x="1342" y="244" font-family="Courier New" font-size="14" font-weight="400" fill="#8A93B8" text-anchor="start">event_id     ← the privacy scope</text><text x="1342" y="268" font-family="Courier New" font-size="14" font-weight="400" fill="#8A93B8" text-anchor="start">bounding box + score</text><text x="1342" y="292" font-family="Courier New" font-size="14" font-weight="400" fill="#8A93B8" text-anchor="start">embedding    vector(512)</text><text x="1342" y="316" font-family="Courier New" font-size="14" font-weight="400" fill="#8A93B8" text-anchor="start">person_id    ← filled in later</text><line x1="365" y1="255" x2="459.4" y2="255" stroke="#33407F" stroke-width="3" stroke-linecap="round"/><polygon points="472,255 459.4,261.3 459.4,248.7" fill="#33407F"/><line x1="785" y1="255" x2="879.4" y2="255" stroke="#33407F" stroke-width="3" stroke-linecap="round"/><polygon points="892,255 879.4,261.3 879.4,248.7" fill="#33407F"/><line x1="1205" y1="255" x2="1299.4" y2="255" stroke="#33407F" stroke-width="3" stroke-linecap="round"/><polygon points="1312,255 1299.4,261.3 1299.4,248.7" fill="#33407F"/><rect x="60" y="470" width="1580" height="190" rx="14" fill="#1A2350" stroke="#4C6FFF" stroke-width="2"/><text x="92" y="512" font-family="Arial" font-size="20" font-weight="700" fill="#4C6FFF" text-anchor="start">WHY CROP AT ALL — why not just feed the whole photo to the model?</text><text x="92" y="552" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">A photo of 30 people is not "a photo of one person". Classifying the whole frame would give you one answer for thirty faces, and that answer would be dominated by</text><text x="92" y="578" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">the background, the lighting and whoever happens to be biggest in frame. Detection turns one messy picture into thirty small, clean, comparable problems — and the</text><text x="92" y="604" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">embedding model then only ever sees a face at a fixed size, upright, filling the frame. That is the entire reason it can be as small and as fast as it is.</text><rect x="60" y="700" width="770" height="190" rx="14" fill="#141B3E" stroke="#FFB020" stroke-width="2"/><text x="92" y="742" font-family="Arial" font-size="20" font-weight="700" fill="#FFB020" text-anchor="start">ALIGNMENT — the step everyone forgets</text><text x="92" y="782" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">RetinaFace also returns five landmarks — two eyes, nose, two mouth</text><text x="92" y="806" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">corners. The crop is warped so those land in the same place every</text><text x="92" y="830" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">time. A tilted head and a straight one become the same picture</text><text x="92" y="854" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">before anything is measured.</text><rect x="870" y="700" width="770" height="190" rx="14" fill="#141B3E" stroke="#3DD68C" stroke-width="2"/><text x="902" y="742" font-family="Arial" font-size="20" font-weight="700" fill="#3DD68C" text-anchor="start">ONE NUMBER THAT DECIDES WHAT COUNTS</text><text x="902" y="782" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">minScore = 0.7. Detections the model is less sure about than that</text><text x="902" y="806" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">are dropped before they ever get an embedding — a blurry shape in</text><text x="902" y="830" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">the background should not become a person.</text></svg>