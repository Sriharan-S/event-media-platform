<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950"><rect width="1700" height="950" fill="#FBF7F2"/><text x="60" y="58" font-family="Arial" font-size="15" font-weight="700" fill="#E2574C" text-anchor="start" letter-spacing="2">CHAPTER SEVEN · NEVER IDLE, NEVER CUT A BATCH SHORT</text><text x="60" y="104" font-family="Arial" font-size="34" font-weight="700" fill="#2A1B3D" text-anchor="start">Waking it, and putting it back to sleep</text><rect x="614" y="166" width="480" height="158" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="610" y="160" width="480" height="158" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="672" cy="236" r="27" fill="#7A4E8C"/><g transform="translate(656.475 220.475) scale(1.29375)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.8 8.8 0 1 0 11.1 11.1z"/></g><text x="722" y="228" font-family="Arial" font-size="27" font-weight="700" fill="#2A1B3D" text-anchor="start">ASLEEP</text><text x="722" y="260" font-family="Arial" font-size="14" font-weight="400" fill="#7C6B84" text-anchor="start">paused · nothing billed · storage kept</text><rect x="1124" y="426" width="480" height="158" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="1120" y="420" width="480" height="158" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="1182" cy="496" r="27" fill="#F2A93B"/><g transform="translate(1166.475 480.475) scale(1.29375)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.8 20 12 6.5 20.2z"/></g><text x="1232" y="488" font-family="Arial" font-size="27" font-weight="700" fill="#2A1B3D" text-anchor="start">WAKING</text><text x="1232" y="520" font-family="Arial" font-size="14" font-weight="400" fill="#7C6B84" text-anchor="start">jl resume · minutes, not seconds</text><rect x="614" y="666" width="480" height="158" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="610" y="660" width="480" height="158" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="672" cy="736" r="27" fill="#E2574C"/><g transform="translate(656.475 720.475) scale(1.29375)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 2 4.5 13.5H11l-.5 8.5 9-11.5H13z"/></g><text x="722" y="728" font-family="Arial" font-size="27" font-weight="700" fill="#2A1B3D" text-anchor="start">WORKING</text><text x="722" y="760" font-family="Arial" font-size="14" font-weight="400" fill="#7C6B84" text-anchor="start">draining the GPU queues</text><rect x="104" y="426" width="480" height="158" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="100" y="420" width="480" height="158" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="162" cy="496" r="27" fill="#2E7D77"/><g transform="translate(146.475 480.475) scale(1.29375)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.5v15 M15 4.5v15"/></g><text x="212" y="488" font-family="Arial" font-size="27" font-weight="700" fill="#2A1B3D" text-anchor="start">STOPPING</text><text x="212" y="520" font-family="Arial" font-size="14" font-weight="400" fill="#7C6B84" text-anchor="start">jl pause · then verify it really stopped</text><line x1="1080" y1="250" x2="1201.5507741871436" y2="401.47096475628655" stroke="#F2A93B" stroke-width="4" stroke-linecap="round"/><polygon points="1210,412 1196.286256565287,405.6955776627148 1206.8152918090002,397.2463518498583" fill="#F2A93B"/><text x="1130" y="190" font-family="Arial" font-size="16" font-weight="700" fill="#F2A93B" text-anchor="start">25 jobs waiting</text><text x="1130" y="214" font-family="Arial" font-size="16" font-weight="700" fill="#F2A93B" text-anchor="start">or one waiting two hours</text><text x="1130" y="238" font-family="Arial" font-size="16" font-weight="700" fill="#F2A93B" text-anchor="start">or a human hit “Process all”</text><line x1="1230" y1="586" x2="1110.541728927481" y2="681.5666168580153" stroke="#E2574C" stroke-width="4" stroke-linecap="round"/><polygon points="1100,690 1106.3250373564886,676.2957523942748 1114.7584204984735,686.8374813217558" fill="#E2574C"/><text x="1270" y="660" font-family="Arial" font-size="16" font-weight="700" fill="#E2574C" text-anchor="start">it reports in</text><line x1="600" y1="700" x2="480.22771732123266" y2="596.8115718459851" stroke="#2E7D77" stroke-width="4" stroke-linecap="round"/><polygon points="470,588 484.6335032442252,591.6977131853688 475.8219313982401,601.9254305066014" fill="#2E7D77"/><text x="96" y="640" font-family="Arial" font-size="16" font-weight="700" fill="#2E7D77" text-anchor="start">quiet for ten minutes</text><text x="96" y="664" font-family="Arial" font-size="16" font-weight="700" fill="#2E7D77" text-anchor="start">(a job “active” for over 30 is</text><text x="96" y="688" font-family="Arial" font-size="16" font-weight="700" fill="#2E7D77" text-anchor="start">an orphan, not work)</text><line x1="400" y1="412" x2="540.7051398478186" y2="263.7905860269644" stroke="#7A4E8C" stroke-width="4" stroke-linecap="round"/><polygon points="550,254 545.6004328613008,268.4380161030551 535.8098468343364,259.1431559508737" fill="#7A4E8C"/><text x="150" y="330" font-family="Arial" font-size="16" font-weight="700" fill="#7A4E8C" text-anchor="start">the provider confirms it</text><path d="M 1600 420 L 1650 420 L 1650 140 L 1090 140" fill="none" stroke="#D9CDC2" stroke-width="3" stroke-dasharray="8 7"/><text x="1370" y="122" font-family="Arial" font-size="14" font-weight="400" fill="#7C6B84" text-anchor="middle">never reported in after 20 min → give up, stop</text><circle cx="850" cy="500" r="96" fill="#F3EBE2"/><circle cx="850" cy="458" r="22" fill="#2A1B3D"/><g transform="translate(837.35 445.35) scale(1.0541666666666665)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 7v5.4l3.4 2"/></g><text x="850" y="512" font-family="Arial" font-size="19" font-weight="700" fill="#2A1B3D" text-anchor="middle">the sweep</text><text x="850" y="538" font-family="Arial" font-size="14" font-weight="400" fill="#7C6B84" text-anchor="middle">every 2 minutes</text><text x="850" y="562" font-family="Arial" font-size="14" font-weight="400" fill="#7C6B84" text-anchor="middle">start · stop · nothing</text><rect x="60" y="838" width="1580" height="86" rx="16" fill="#2A1B3D" stroke="none" stroke-width="2"/><circle cx="116" cy="881" r="24" fill="#F2A93B"/><g transform="translate(102.2 867.2) scale(1.15)" fill="none" stroke="#2A1B3D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 20 6v6c0 5-3.4 8.4-8 9.5-4.6-1.1-8-4.5-8-9.5V6z M9 12l2.2 2.2L15.5 10"/></g><text x="160" y="874" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">The expensive resource fails closed.</text><text x="160" y="902" font-family="Arial" font-size="15" font-weight="400" fill="#C9BBD6" text-anchor="start">The box polls us. If we say stop — or we are simply unreachable — it shuts itself down. A failed pause is not a runaway bill.</text></svg>