<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950"><rect width="1700" height="950" fill="#0E1330"/><text x="60" y="62" font-family="Arial" font-size="26" font-weight="400" fill="#8A93B8" text-anchor="start">End-to-end: a photo is uploaded, a stranger gets only their own pictures</text><rect x="60" y="140" width="300" height="190" rx="14" fill="#1A2350" stroke="#4C6FFF" stroke-width="2"/><circle cx="94" cy="174" r="20" fill="#4C6FFF"/><text x="94" y="181" font-family="Arial" font-size="20" font-weight="700" fill="#0E1330" text-anchor="middle">1</text><text x="80" y="236" font-family="Arial" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start">Organiser uploads</text><text x="80" y="272" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">SHA-1 computed in the browser</text><text x="80" y="293" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">first — duplicates never travel</text><text x="80" y="314" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">twice</text><line x1="364" y1="235" x2="379.2" y2="235" stroke="#33407F" stroke-width="3" stroke-linecap="round"/><polygon points="390,235 379.2,240.4 379.2,229.6" fill="#33407F"/><rect x="394" y="140" width="300" height="190" rx="14" fill="#1A2350" stroke="#4C6FFF" stroke-width="2"/><circle cx="428" cy="174" r="20" fill="#4C6FFF"/><text x="428" y="181" font-family="Arial" font-size="20" font-weight="700" fill="#0E1330" text-anchor="middle">2</text><text x="414" y="236" font-family="Arial" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start">Original lands in R2</text><text x="414" y="272" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">asset + exif rows written to</text><text x="414" y="293" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">Postgres; preview &amp; thumbnail</text><text x="414" y="314" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">generated</text><line x1="698" y1="235" x2="713.2" y2="235" stroke="#33407F" stroke-width="3" stroke-linecap="round"/><polygon points="724,235 713.2,240.4 713.2,229.6" fill="#33407F"/><rect x="728" y="140" width="300" height="190" rx="14" fill="#1A2350" stroke="#4C6FFF" stroke-width="2"/><circle cx="762" cy="174" r="20" fill="#4C6FFF"/><text x="762" y="181" font-family="Arial" font-size="20" font-weight="700" fill="#0E1330" text-anchor="middle">3</text><text x="748" y="236" font-family="Arial" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start">Job pushed to Redis</text><text x="748" y="272" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">BullMQ. Nobody waits. The GPU may</text><text x="748" y="293" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">not even be switched on yet</text><line x1="1032" y1="235" x2="1047.2" y2="235" stroke="#33407F" stroke-width="3" stroke-linecap="round"/><polygon points="1058,235 1047.2,240.4 1047.2,229.6" fill="#33407F"/><rect x="1062" y="140" width="300" height="190" rx="14" fill="#1A2350" stroke="#FFB020" stroke-width="2"/><circle cx="1096" cy="174" r="20" fill="#FFB020"/><text x="1096" y="181" font-family="Arial" font-size="20" font-weight="700" fill="#0E1330" text-anchor="middle">4</text><text x="1082" y="236" font-family="Arial" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start">Sweep wakes the GPU</text><text x="1082" y="272" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">25 jobs queued, or one job waiting</text><text x="1082" y="293" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">120 min → jl resume</text><line x1="1366" y1="235" x2="1381.2" y2="235" stroke="#33407F" stroke-width="3" stroke-linecap="round"/><polygon points="1392,235 1381.2,240.4 1381.2,229.6" fill="#33407F"/><rect x="1396" y="140" width="300" height="190" rx="14" fill="#1A2350" stroke="#FFB020" stroke-width="2"/><circle cx="1430" cy="174" r="20" fill="#FFB020"/><text x="1430" y="181" font-family="Arial" font-size="20" font-weight="700" fill="#0E1330" text-anchor="middle">5</text><text x="1416" y="236" font-family="Arial" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start">Worker pulls the job</text><text x="1416" y="272" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">backend-worker fetches the</text><text x="1416" y="293" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">original from R2, POSTs it to the</text><text x="1416" y="314" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">ml sidecar</text><line x1="1546" y1="336" x2="1546" y2="411.2" stroke="#33407F" stroke-width="3" stroke-linecap="round"/><polygon points="1546,422 1540.6,411.2 1551.4,411.2" fill="#33407F"/><rect x="1396" y="430" width="300" height="190" rx="14" fill="#1A2350" stroke="#FFB020" stroke-width="2"/><circle cx="1430" cy="464" r="20" fill="#FFB020"/><text x="1430" y="471" font-family="Arial" font-size="20" font-weight="700" fill="#0E1330" text-anchor="middle">6</text><text x="1416" y="526" font-family="Arial" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start">Faces → 512 numbers</text><text x="1416" y="562" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">RetinaFace boxes, ArcFace</text><text x="1416" y="583" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">embeddings, stored in pgvector</text><line x1="1400" y1="525" x2="1368.8" y2="525" stroke="#33407F" stroke-width="3" stroke-linecap="round"/><polygon points="1358,525 1368.8,519.6 1368.8,530.4" fill="#33407F"/><rect x="1062" y="430" width="300" height="190" rx="14" fill="#1A2350" stroke="#3DD68C" stroke-width="2"/><circle cx="1096" cy="464" r="20" fill="#3DD68C"/><text x="1096" y="471" font-family="Arial" font-size="20" font-weight="700" fill="#0E1330" text-anchor="middle">7</text><text x="1082" y="526" font-family="Arial" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start">Selfie submitted</text><text x="1082" y="562" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">public /e/{slug} page,</text><text x="1082" y="583" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">rate-limited, one photo per person</text><line x1="1066" y1="525" x2="1034.8" y2="525" stroke="#33407F" stroke-width="3" stroke-linecap="round"/><polygon points="1024,525 1034.8,519.6 1034.8,530.4" fill="#33407F"/><rect x="728" y="430" width="300" height="190" rx="14" fill="#1A2350" stroke="#3DD68C" stroke-width="2"/><circle cx="762" cy="464" r="20" fill="#3DD68C"/><text x="762" y="471" font-family="Arial" font-size="20" font-weight="700" fill="#0E1330" text-anchor="middle">8</text><text x="748" y="526" font-family="Arial" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start">Event-scoped search</text><text x="748" y="562" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">nearest-neighbour over that event</text><text x="748" y="583" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">only — never across events</text><line x1="732" y1="525" x2="700.8" y2="525" stroke="#33407F" stroke-width="3" stroke-linecap="round"/><polygon points="690,525 700.8,519.6 700.8,530.4" fill="#33407F"/><rect x="394" y="430" width="300" height="190" rx="14" fill="#1A2350" stroke="#3DD68C" stroke-width="2"/><circle cx="428" cy="464" r="20" fill="#3DD68C"/><text x="428" y="471" font-family="Arial" font-size="20" font-weight="700" fill="#0E1330" text-anchor="middle">9</text><text x="414" y="526" font-family="Arial" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start">Gallery + email</text><text x="414" y="562" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">token stored hashed for lookup,</text><text x="414" y="583" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">encrypted for the digest mail</text><line x1="398" y1="525" x2="366.8" y2="525" stroke="#33407F" stroke-width="3" stroke-linecap="round"/><polygon points="356,525 366.8,519.6 366.8,530.4" fill="#33407F"/><rect x="60" y="430" width="300" height="190" rx="14" fill="#1A2350" stroke="#FFB020" stroke-width="2"/><circle cx="94" cy="464" r="20" fill="#FFB020"/><text x="94" y="471" font-family="Arial" font-size="20" font-weight="700" fill="#0E1330" text-anchor="middle">10</text><text x="80" y="526" font-family="Arial" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start">Queues go quiet</text><text x="80" y="562" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">10 idle minutes → jl pause.</text><text x="80" y="583" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">Storage kept, billing stops</text><rect x="60" y="690" width="1580" height="200" rx="14" fill="#141B3E" stroke="#33407F" stroke-width="2" stroke-dasharray="6 6"/><text x="90" y="734" font-family="Arial" font-size="17" font-weight="700" fill="#8A93B8" text-anchor="start">READ THE COLOURS</text><rect x="90" y="758" width="484" height="104" rx="10" fill="#1A2350"/><circle cx="120" cy="790" r="12" fill="#4C6FFF"/><text x="146" y="798" font-family="Arial" font-size="19" font-weight="700" fill="#4C6FFF" text-anchor="start">API host — always on</text><text x="114" y="834" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">Cheap. Handles every request, owns the queues and the</text><text x="114" y="854" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">clock.</text><rect x="602" y="758" width="484" height="104" rx="10" fill="#1A2350"/><circle cx="632" cy="790" r="12" fill="#FFB020"/><text x="658" y="798" font-family="Arial" font-size="19" font-weight="700" fill="#FFB020" text-anchor="start">GPU host — on demand</text><text x="626" y="834" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">Steps 4–6 and 10 are the same machine waking up and</text><text x="626" y="854" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">going back to sleep.</text><rect x="1114" y="758" width="484" height="104" rx="10" fill="#1A2350"/><circle cx="1144" cy="790" r="12" fill="#3DD68C"/><text x="1170" y="798" font-family="Arial" font-size="19" font-weight="700" fill="#3DD68C" text-anchor="start">Participant path</text><text x="1138" y="834" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">Public, tokenised, event-scoped. No account, no access</text><text x="1138" y="854" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">to anyone else.</text></svg>