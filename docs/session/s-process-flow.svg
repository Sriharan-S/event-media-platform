<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950"><rect width="1700" height="950" fill="#FBF7F2"/><text x="60" y="58" font-family="Arial" font-size="15" font-weight="700" fill="#E2574C" text-anchor="start" letter-spacing="2">THE JOURNEY · FROM HER FRIEND’S CAMERA TO HER INBOX</text><text x="60" y="104" font-family="Arial" font-size="34" font-weight="700" fill="#2A1B3D" text-anchor="start">Ten steps, two machines, nobody waiting</text><rect x="64" y="192" width="296" height="220" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="60" y="186" width="296" height="220" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="112" cy="248" r="25" fill="#E2574C"/><g transform="translate(97.625 233.625) scale(1.1979166666666665)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5a2 2 0 0 1 2-2h2.2l1.3-2h6.4l1.3 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/></g><text x="332" y="242" font-family="Arial" font-size="30" font-weight="700" fill="#F3EBE2" text-anchor="end">01</text><text x="84" y="310" font-family="Arial" font-size="18" font-weight="700" fill="#2A1B3D" text-anchor="start">The photos are taken</text><text x="84" y="360" font-family="Arial" font-size="13.5" font-weight="400" fill="#7C6B84" text-anchor="start">4,000 of them, one long evening</text><line x1="359" y1="296" x2="363.2" y2="296" stroke="#D9CDC2" stroke-width="4" stroke-linecap="round"/><polygon points="374,296 363.2,301.4 363.2,290.6" fill="#D9CDC2"/><rect x="382" y="192" width="296" height="220" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="378" y="186" width="296" height="220" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="430" cy="248" r="25" fill="#E2574C"/><g transform="translate(415.625 233.625) scale(1.1979166666666665)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4 M7.5 8.5 12 4l4.5 4.5 M4 15v3.5a1.5 1.5 0 0 0 1.5 1.5h13a1.5 1.5 0 0 0 1.5-1.5V15"/></g><text x="650" y="242" font-family="Arial" font-size="30" font-weight="700" fill="#F3EBE2" text-anchor="end">02</text><text x="402" y="310" font-family="Arial" font-size="18" font-weight="700" fill="#2A1B3D" text-anchor="start">The organiser uploads</text><text x="402" y="360" font-family="Arial" font-size="13.5" font-weight="400" fill="#7C6B84" text-anchor="start">the browser fingerprints each file</text><text x="402" y="379" font-family="Arial" font-size="13.5" font-weight="400" fill="#7C6B84" text-anchor="start">first, so nothing travels twice</text><line x1="677" y1="296" x2="681.2" y2="296" stroke="#D9CDC2" stroke-width="4" stroke-linecap="round"/><polygon points="692,296 681.2,301.4 681.2,290.6" fill="#D9CDC2"/><rect x="700" y="192" width="296" height="220" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="696" y="186" width="296" height="220" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="748" cy="248" r="25" fill="#E2574C"/><g transform="translate(733.625 233.625) scale(1.1979166666666665)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .4-7.98A6 6 0 0 0 5.8 11.2 3.4 3.4 0 0 0 7 18z"/></g><text x="968" y="242" font-family="Arial" font-size="30" font-weight="700" fill="#F3EBE2" text-anchor="end">03</text><text x="720" y="310" font-family="Arial" font-size="18" font-weight="700" fill="#2A1B3D" text-anchor="start">Originals land in R2</text><text x="720" y="360" font-family="Arial" font-size="13.5" font-weight="400" fill="#7C6B84" text-anchor="start">previews and thumbnails made, rows</text><text x="720" y="379" font-family="Arial" font-size="13.5" font-weight="400" fill="#7C6B84" text-anchor="start">written to Postgres</text><line x1="995" y1="296" x2="999.2" y2="296" stroke="#D9CDC2" stroke-width="4" stroke-linecap="round"/><polygon points="1010,296 999.2,301.4 999.2,290.6" fill="#D9CDC2"/><rect x="1018" y="192" width="296" height="220" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="1014" y="186" width="296" height="220" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="1066" cy="248" r="25" fill="#E2574C"/><g transform="translate(1051.625 233.625) scale(1.1979166666666665)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16 M4 12h16 M4 18h10"/></g><text x="1286" y="242" font-family="Arial" font-size="30" font-weight="700" fill="#F3EBE2" text-anchor="end">04</text><text x="1038" y="310" font-family="Arial" font-size="18" font-weight="700" fill="#2A1B3D" text-anchor="start">A job joins the queue</text><text x="1038" y="360" font-family="Arial" font-size="13.5" font-weight="400" fill="#7C6B84" text-anchor="start">Redis. Nobody waits. The GPU may</text><text x="1038" y="379" font-family="Arial" font-size="13.5" font-weight="400" fill="#7C6B84" text-anchor="start">still be switched off</text><line x1="1313" y1="296" x2="1317.2" y2="296" stroke="#D9CDC2" stroke-width="4" stroke-linecap="round"/><polygon points="1328,296 1317.2,301.4 1317.2,290.6" fill="#D9CDC2"/><rect x="1336" y="192" width="296" height="220" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="1332" y="186" width="296" height="220" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="1384" cy="248" r="25" fill="#F2A93B"/><g transform="translate(1369.625 233.625) scale(1.1979166666666665)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 2 4.5 13.5H11l-.5 8.5 9-11.5H13z"/></g><text x="1604" y="242" font-family="Arial" font-size="30" font-weight="700" fill="#F3EBE2" text-anchor="end">05</text><text x="1356" y="310" font-family="Arial" font-size="18" font-weight="700" fill="#2A1B3D" text-anchor="start">The GPU wakes</text><text x="1356" y="360" font-family="Arial" font-size="13.5" font-weight="400" fill="#7C6B84" text-anchor="start">25 jobs waiting, or one job waiting</text><text x="1356" y="379" font-family="Arial" font-size="13.5" font-weight="400" fill="#7C6B84" text-anchor="start">two hours</text><line x1="1480" y1="412" x2="1480" y2="495.2" stroke="#D9CDC2" stroke-width="4" stroke-linecap="round"/><polygon points="1480,506 1474.6,495.2 1485.4,495.2" fill="#D9CDC2"/><rect x="1336" y="516" width="296" height="220" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="1332" y="510" width="296" height="220" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="1384" cy="572" r="25" fill="#F2A93B"/><g transform="translate(1369.625 557.625) scale(1.1979166666666665)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8 M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8 M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16 M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16 M12 13.6a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4z M8.2 17c.6-1.7 2-2.6 3.8-2.6s3.2.9 3.8 2.6"/></g><text x="1604" y="566" font-family="Arial" font-size="30" font-weight="700" fill="#F3EBE2" text-anchor="end">06</text><text x="1356" y="634" font-family="Arial" font-size="18" font-weight="700" fill="#2A1B3D" text-anchor="start">Faces are found and</text><text x="1356" y="658" font-family="Arial" font-size="18" font-weight="700" fill="#2A1B3D" text-anchor="start">measured</text><text x="1356" y="684" font-family="Arial" font-size="13.5" font-weight="400" fill="#7C6B84" text-anchor="start">RetinaFace, then ArcFace, once per</text><text x="1356" y="703" font-family="Arial" font-size="13.5" font-weight="400" fill="#7C6B84" text-anchor="start">face</text><line x1="1329" y1="620" x2="1324.8" y2="620" stroke="#D9CDC2" stroke-width="4" stroke-linecap="round"/><polygon points="1314,620 1324.8,614.6 1324.8,625.4" fill="#D9CDC2"/><rect x="1018" y="516" width="296" height="220" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="1014" y="510" width="296" height="220" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="1066" cy="572" r="25" fill="#F2A93B"/><g transform="translate(1051.625 557.625) scale(1.1979166666666665)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z M2.5 20.5c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6 M16.5 5.2a3.4 3.4 0 0 1 0 6.6 M17.5 14.8c2.4.6 4 2.6 4 5.7"/></g><text x="1286" y="566" font-family="Arial" font-size="30" font-weight="700" fill="#F3EBE2" text-anchor="end">07</text><text x="1038" y="634" font-family="Arial" font-size="18" font-weight="700" fill="#2A1B3D" text-anchor="start">People appear</text><text x="1038" y="684" font-family="Arial" font-size="13.5" font-weight="400" fill="#7C6B84" text-anchor="start">each face joins a cluster or starts</text><text x="1038" y="703" font-family="Arial" font-size="13.5" font-weight="400" fill="#7C6B84" text-anchor="start">one</text><line x1="1011" y1="620" x2="1006.8" y2="620" stroke="#D9CDC2" stroke-width="4" stroke-linecap="round"/><polygon points="996,620 1006.8,614.6 1006.8,625.4" fill="#D9CDC2"/><rect x="700" y="516" width="296" height="220" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="696" y="510" width="296" height="220" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="748" cy="572" r="25" fill="#2E7D77"/><g transform="translate(733.625 557.625) scale(1.1979166666666665)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z M12 14.8a2.8 2.8 0 1 0 0-5.6 2.8 2.8 0 0 0 0 5.6z"/></g><text x="968" y="566" font-family="Arial" font-size="30" font-weight="700" fill="#F3EBE2" text-anchor="end">08</text><text x="720" y="634" font-family="Arial" font-size="18" font-weight="700" fill="#2A1B3D" text-anchor="start">Meera submits a selfie</text><text x="720" y="684" font-family="Arial" font-size="13.5" font-weight="400" fill="#7C6B84" text-anchor="start">a public link, one photo, no account</text><line x1="693" y1="620" x2="688.8" y2="620" stroke="#D9CDC2" stroke-width="4" stroke-linecap="round"/><polygon points="678,620 688.8,614.6 688.8,625.4" fill="#D9CDC2"/><rect x="382" y="516" width="296" height="220" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="378" y="510" width="296" height="220" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="430" cy="572" r="25" fill="#2E7D77"/><g transform="translate(415.625 557.625) scale(1.1979166666666665)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 18.5a7.5 7.5 0 1 0 0-15 7.5 7.5 0 0 0 0 15z M16.5 16.5 21 21"/></g><text x="650" y="566" font-family="Arial" font-size="30" font-weight="700" fill="#F3EBE2" text-anchor="end">09</text><text x="402" y="634" font-family="Arial" font-size="18" font-weight="700" fill="#2A1B3D" text-anchor="start">Her face is looked up</text><text x="402" y="684" font-family="Arial" font-size="13.5" font-weight="400" fill="#7C6B84" text-anchor="start">nearest neighbours inside this event</text><text x="402" y="703" font-family="Arial" font-size="13.5" font-weight="400" fill="#7C6B84" text-anchor="start">only</text><line x1="375" y1="620" x2="370.8" y2="620" stroke="#D9CDC2" stroke-width="4" stroke-linecap="round"/><polygon points="360,620 370.8,614.6 370.8,625.4" fill="#D9CDC2"/><rect x="64" y="516" width="296" height="220" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="60" y="510" width="296" height="220" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="112" cy="572" r="25" fill="#2E7D77"/><g transform="translate(97.625 557.625) scale(1.1979166666666665)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5h18v11H3z M3 7l9 6.5L21 7"/></g><text x="332" y="566" font-family="Arial" font-size="30" font-weight="700" fill="#F3EBE2" text-anchor="end">10</text><text x="84" y="634" font-family="Arial" font-size="18" font-weight="700" fill="#2A1B3D" text-anchor="start">A private gallery, and</text><text x="84" y="658" font-family="Arial" font-size="18" font-weight="700" fill="#2A1B3D" text-anchor="start">an email</text><text x="84" y="684" font-family="Arial" font-size="13.5" font-weight="400" fill="#7C6B84" text-anchor="start">her photos, nobody else’s</text><text x="60" y="858" font-family="Arial" font-size="13" font-weight="700" fill="#7C6B84" text-anchor="start" letter-spacing="1.4">READ THE COLOURS</text><circle cx="72" cy="894" r="11" fill="#E2574C"/><text x="94" y="900" font-family="Arial" font-size="16" font-weight="400" fill="#2A1B3D" text-anchor="start">always-on API box</text><circle cx="321.8" cy="894" r="11" fill="#F2A93B"/><text x="343.8" y="900" font-family="Arial" font-size="16" font-weight="400" fill="#2A1B3D" text-anchor="start">the GPU, awake</text><circle cx="543.4" cy="894" r="11" fill="#2E7D77"/><text x="565.4" y="900" font-family="Arial" font-size="16" font-weight="400" fill="#2A1B3D" text-anchor="start">the guest’s side</text><text x="1640" y="900" font-family="Arial" font-size="15" font-weight="400" fill="#7A4E8C" text-anchor="end" font-style="italic">steps 5–7 are the only ones that cost money by the second</text></svg>