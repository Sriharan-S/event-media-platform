<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950"><rect width="1700" height="950" fill="#FBF7F2"/><text x="60" y="58" font-family="Arial" font-size="15" font-weight="700" fill="#E2574C" text-anchor="start" letter-spacing="2">CHAPTER FOUR · WHAT “YOU” LOOKS LIKE AS NUMBERS</text><text x="60" y="104" font-family="Arial" font-size="34" font-weight="700" fill="#2A1B3D" text-anchor="start">Same person lands close. That is the entire trick.</text><rect x="64" y="156" width="1000" height="650" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="60" y="150" width="1000" height="650" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="92" y="194" font-family="Arial" font-size="13" font-weight="700" fill="#7C6B84" text-anchor="start" letter-spacing="1.4">A FLATTENED PICTURE OF A 512-DIMENSIONAL SPACE</text><text x="92" y="218" font-family="Arial" font-size="14" font-weight="400" fill="#D9CDC2" text-anchor="start" font-style="italic">drawn in 2D so it fits on a slide — the real thing has 512 axes</text><circle cx="300" cy="400" r="80" fill="#E2574C" fill-opacity="0.10"/><circle cx="300" cy="400" r="80" fill="none" stroke="#E2574C" stroke-width="2" stroke-dasharray="7 7"/><circle cx="303.5737664210652" cy="357.7426335619421" r="9" fill="#E2574C"/><circle cx="333.9520671115227" cy="361.7924119518625" r="9" fill="#E2574C"/><circle cx="308.3672535041149" cy="386.6755548352916" r="9" fill="#E2574C"/><circle cx="334.6412259722229" cy="392.8313966349911" r="9" fill="#E2574C"/><circle cx="312.51643073985997" cy="441.32654439189434" r="9" fill="#E2574C"/><circle cx="297.444343340875" cy="422.1531667234262" r="9" fill="#E2574C"/><circle cx="277.01444079831003" cy="360.8585056189108" r="9" fill="#E2574C"/><circle cx="286.06356540010705" cy="354.86545982604133" r="9" fill="#E2574C"/><text x="300" y="510" font-family="Arial" font-size="19" font-weight="700" fill="#E2574C" text-anchor="middle">Meera</text><circle cx="700" cy="330" r="80" fill="#F2A93B" fill-opacity="0.10"/><circle cx="700" cy="330" r="80" fill="none" stroke="#F2A93B" stroke-width="2" stroke-dasharray="7 7"/><circle cx="673.6219960652971" cy="283.25843088330953" r="9" fill="#F2A93B"/><circle cx="738.8593885064239" cy="360.9688379059251" r="9" fill="#F2A93B"/><circle cx="678.017965578238" cy="340.8454710961172" r="9" fill="#F2A93B"/><circle cx="735.8273814061274" cy="359.93331566649954" r="9" fill="#F2A93B"/><circle cx="680.6528951252601" cy="321.02525613381516" r="9" fill="#F2A93B"/><circle cx="671.4969482952467" cy="334.75897129966114" r="9" fill="#F2A93B"/><text x="700" y="440" font-family="Arial" font-size="19" font-weight="700" fill="#F2A93B" text-anchor="middle">Arjun</text><circle cx="380" cy="645" r="80" fill="#2E7D77" fill-opacity="0.10"/><circle cx="380" cy="645" r="80" fill="none" stroke="#2E7D77" stroke-width="2" stroke-dasharray="7 7"/><circle cx="399.9326012887342" cy="609.3495888513847" r="9" fill="#2E7D77"/><circle cx="387.1676721140741" cy="620.1664455929999" r="9" fill="#2E7D77"/><circle cx="415.8123893929486" cy="598.3098450893543" r="9" fill="#2E7D77"/><circle cx="328.00872224167324" cy="638.5825851603375" r="9" fill="#2E7D77"/><circle cx="358.22298114457" cy="654.0228591639609" r="9" fill="#2E7D77"/><circle cx="340.90380403950854" cy="609.257034090055" r="9" fill="#2E7D77"/><text x="380" y="755" font-family="Arial" font-size="19" font-weight="700" fill="#2E7D77" text-anchor="middle">Priya</text><circle cx="760" cy="645" r="80" fill="#7A4E8C" fill-opacity="0.10"/><circle cx="760" cy="645" r="80" fill="none" stroke="#7A4E8C" stroke-width="2" stroke-dasharray="7 7"/><circle cx="746.43879147242" cy="623.3604440002183" r="9" fill="#7A4E8C"/><circle cx="806.4893605938172" cy="603.8458034233767" r="9" fill="#7A4E8C"/><circle cx="771.0582249847876" cy="691.6600620512482" r="9" fill="#7A4E8C"/><circle cx="744.5281055913373" cy="615.0432946910066" r="9" fill="#7A4E8C"/><circle cx="787.5852507545775" cy="626.2130277361714" r="9" fill="#7A4E8C"/><text x="760" y="755" font-family="Arial" font-size="19" font-weight="700" fill="#7A4E8C" text-anchor="middle">Sam</text><circle cx="322" cy="426" r="15" fill="#FFFFFF" stroke="#E2574C" stroke-width="5"/><text x="296" y="300" font-family="Arial" font-size="16" font-weight="700" fill="#2A1B3D" text-anchor="middle">her selfie</text><line x1="300" y1="312" x2="314.45792942723875" y2="395.13309420662296" stroke="#2A1B3D" stroke-width="2" stroke-linecap="round"/><polygon points="316,404 310.0244765305502,395.90412949300355 318.8913823239273,394.36205892024236" fill="#2A1B3D"/><line x1="268" y1="540" x2="297.8525322286327" y2="496.8796756697528" stroke="#E2574C" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/><polygon points="304,488 302.2923700635091,499.9534095554365 293.4126943937563,493.80594178406915" fill="#E2574C"/><text x="96" y="550" font-family="Arial" font-size="15" font-weight="700" fill="#E2574C" text-anchor="start">0.31 to another red dot</text><text x="96" y="572" font-family="Arial" font-size="15" font-weight="700" fill="#E2574C" text-anchor="start">inside the line → same person</text><line x1="384" y1="398" x2="605.4239874693233" y2="352.1881405235883" stroke="#7C6B84" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/><polygon points="616,350 606.5180577311174,357.47614678892666 604.3299172075291,346.9001342582499" fill="#7C6B84"/><text x="452" y="476" font-family="Arial" font-size="15" font-weight="400" fill="#7C6B84" text-anchor="start">0.84 to a gold dot</text><text x="452" y="498" font-family="Arial" font-size="15" font-weight="400" fill="#7C6B84" text-anchor="start">past the line → someone else</text><rect x="1114" y="156" width="530" height="300" rx="18" fill="#2A1B3D" opacity="0.07"/><rect x="1110" y="150" width="530" height="300" rx="18" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="1142" y="206" font-family="Arial" font-size="13" font-weight="700" fill="#7C6B84" text-anchor="start" letter-spacing="1.4">THE ONE JUDGEMENT CALL</text><text x="1142" y="240" font-family="Arial" font-size="27" font-weight="700" fill="#2A1B3D" text-anchor="start">maxDistance = 0.5</text><rect x="1142" y="280" width="464" height="26" rx="13" fill="#F3EBE2"/><rect x="1142" y="280" width="116" height="26" rx="13" fill="#E2574C"/><line x1="1258" y1="268" x2="1258" y2="318" stroke="#2A1B3D" stroke-width="3"/><text x="1142" y="342" font-family="Arial" font-size="13" font-weight="400" fill="#7C6B84" text-anchor="start">0.0</text><text x="1258" y="342" font-family="Arial" font-size="14" font-weight="700" fill="#2A1B3D" text-anchor="middle">0.5</text><text x="1606" y="342" font-family="Arial" font-size="13" font-weight="400" fill="#7C6B84" text-anchor="end">2.0</text><text x="1200" y="260" font-family="Arial" font-size="13" font-weight="700" fill="#E2574C" text-anchor="middle">same person</text><text x="1429.68" y="260" font-family="Arial" font-size="13" font-weight="400" fill="#7C6B84" text-anchor="middle">someone else</text><text x="1142" y="386" font-family="Courier New" font-size="14" font-weight="400" fill="#7C6B84" text-anchor="start">cosine distance — written  &lt;=&gt;  in Postgres</text><rect x="1110" y="480" width="530" height="320" rx="18" fill="#2A1B3D" stroke="none" stroke-width="2"/><text x="1142" y="528" font-family="Arial" font-size="13" font-weight="700" fill="#F2A93B" text-anchor="start" letter-spacing="1.4">THE TWO MISTAKES ARE NOT EQUAL</text><circle cx="1162" cy="576" r="18" fill="#F2A93B"/><g transform="translate(1151.65 565.65) scale(0.8624999999999999)" fill="none" stroke="#2A1B3D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12 M18 6 6 18"/></g><text x="1194" y="570" font-family="Arial" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Too tight → you split in two</text><text x="1194" y="596" font-family="Arial" font-size="14" font-weight="400" fill="#C9BBD6" text-anchor="start">She gets half her photos. Annoying, fixable.</text><circle cx="1162" cy="656" r="18" fill="#E2574C"/><g transform="translate(1151.65 645.65) scale(0.8624999999999999)" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 22 20.5H2z M12 9.5v5 M12 17.6v.2"/></g><text x="1194" y="650" font-family="Arial" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Too loose → two people merge</text><text x="1194" y="676" font-family="Arial" font-size="14" font-weight="400" fill="#C9BBD6" text-anchor="start">She gets a stranger’s photos. Not fixable.</text><text x="1142" y="730" font-family="Arial" font-size="15" font-weight="400" fill="#F2A93B" text-anchor="start" font-style="italic">When two failures cost different amounts, let</text><text x="1142" y="754" font-family="Arial" font-size="15" font-weight="400" fill="#F2A93B" text-anchor="start" font-style="italic">the cheaper one set your default.</text><rect x="60" y="830" width="1580" height="96" rx="16" fill="#F3EBE2" stroke="none" stroke-width="2"/><text x="92" y="872" font-family="Arial" font-size="18" font-weight="700" fill="#2A1B3D" text-anchor="start">Every one of those searches is fenced to a single event — in the query itself, not filtered afterwards.</text><text x="92" y="902" font-family="Arial" font-size="15" font-weight="400" fill="#7C6B84" text-anchor="start">The same person really does attend two different parties. Reaching across them would hand a stranger photos they were never in.</text></svg>