<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950"><rect width="1700" height="950" fill="#0E1330"/><text x="60" y="60" font-family="Arial" font-size="26" font-weight="400" fill="#8A93B8" text-anchor="start">Nearness is one number measured across all 512 dimensions at once</text><rect x="60" y="110" width="940" height="620" rx="14" fill="#141B3E" stroke="#33407F" stroke-width="2"/><text x="84" y="150" font-family="Arial" font-size="15" font-weight="700" fill="#8A93B8" text-anchor="start">A FLATTENED PICTURE OF THE 512-DIMENSIONAL SPACE</text><text x="84" y="174" font-family="Arial" font-size="14" font-weight="400" fill="#33407F" text-anchor="start" font-style="italic">(drawn in 2D so it fits on a slide — the real thing has 512 axes)</text><circle cx="330" cy="300" r="78" fill="#3DD68C" fill-opacity="0.10" stroke="#3DD68C" stroke-width="2" stroke-dasharray="7 6"/><circle cx="307.40622761699467" cy="284.2147993237216" r="8" fill="#3DD68C"/><circle cx="268.8939693819018" cy="283.3690878399857" r="8" fill="#3DD68C"/><circle cx="311.4390955348501" cy="265.111479835436" r="8" fill="#3DD68C"/><circle cx="370.7678757930209" cy="256.52839224534546" r="8" fill="#3DD68C"/><circle cx="386.98270270392476" cy="328.8358428094336" r="8" fill="#3DD68C"/><circle cx="335.53384912214324" cy="321.34888488609295" r="8" fill="#3DD68C"/><circle cx="345.0541844644013" cy="299.3147199859185" r="8" fill="#3DD68C"/><text x="330" y="404" font-family="Arial" font-size="18" font-weight="700" fill="#3DD68C" text-anchor="middle">Priya</text><circle cx="640" cy="260" r="78" fill="#FFB020" fill-opacity="0.10" stroke="#FFB020" stroke-width="2" stroke-dasharray="7 6"/><circle cx="629.8715431414232" cy="269.0357995208097" r="8" fill="#FFB020"/><circle cx="682.3012912013044" cy="280.55651709407823" r="8" fill="#FFB020"/><circle cx="688.0485992170138" cy="235.1416785720355" r="8" fill="#FFB020"/><circle cx="639.156016549514" cy="244.71020222209134" r="8" fill="#FFB020"/><circle cx="612.1485304868824" cy="234.4585030518877" r="8" fill="#FFB020"/><text x="640" y="364" font-family="Arial" font-size="18" font-weight="700" fill="#FFB020" text-anchor="middle">Arjun</text><circle cx="430" cy="560" r="78" fill="#FF7AA8" fill-opacity="0.10" stroke="#FF7AA8" stroke-width="2" stroke-dasharray="7 6"/><circle cx="446.68092960598864" cy="615.9676266122715" r="8" fill="#FF7AA8"/><circle cx="478.78243439923915" cy="582.5496559552944" r="8" fill="#FF7AA8"/><circle cx="438.13214101122713" cy="570.6687430798395" r="8" fill="#FF7AA8"/><circle cx="419.46246033118973" cy="510.6965402104558" r="8" fill="#FF7AA8"/><circle cx="465.59079393330506" cy="518.7044949722931" r="8" fill="#FF7AA8"/><circle cx="455.9955835815873" cy="516.5760465546635" r="8" fill="#FF7AA8"/><text x="430" y="664" font-family="Arial" font-size="18" font-weight="700" fill="#FF7AA8" text-anchor="middle">Meera</text><circle cx="780" cy="540" r="78" fill="#4C6FFF" fill-opacity="0.10" stroke="#4C6FFF" stroke-width="2" stroke-dasharray="7 6"/><circle cx="808.8654815142427" cy="546.6807033738329" r="8" fill="#4C6FFF"/><circle cx="807.1267522937461" cy="577.4722258009506" r="8" fill="#4C6FFF"/><circle cx="759.5415997737217" cy="558.4804315687915" r="8" fill="#4C6FFF"/><circle cx="787.0625046339137" cy="512.6261600995722" r="8" fill="#4C6FFF"/><text x="780" y="644" font-family="Arial" font-size="18" font-weight="700" fill="#4C6FFF" text-anchor="middle">Sam</text><circle cx="368" cy="330" r="13" fill="#FFFFFF" stroke="#3DD68C" stroke-width="4"/><text x="368" y="300" font-family="Arial" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">your selfie</text><line x1="200" y1="430" x2="292.0419651978893" y2="361.8889457535619" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><polygon points="300,356 294.9864380746702,365.86796315461726 289.09749232110835,357.9099283525066" fill="#FFFFFF"/><text x="96" y="452" font-family="Arial" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">distance 0.31 to another green face</text><text x="96" y="474" font-family="Arial" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">→ inside the threshold, same person</text><line x1="392" y1="318" x2="556.4850509432345" y2="270.73418076343836" stroke="#8A93B8" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><polygon points="566,268 557.8521413249537,275.49165529182113 555.1179605615152,265.9767062350556" fill="#8A93B8"/><text x="880" y="250" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">distance 0.84 to an orange face</text><text x="880" y="272" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">→ too far, a different person</text><rect x="1040" y="110" width="600" height="300" rx="14" fill="#1A2350" stroke="#A9BEFF" stroke-width="2"/><text x="1068" y="158" font-family="Arial" font-size="20" font-weight="700" fill="#A9BEFF" text-anchor="start">THE RULER</text><text x="1068" y="192" font-family="Courier New" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">cosine distance, written  &lt;=&gt;  in Postgres</text><rect x="1080" y="240" width="520" height="26" rx="13" fill="#20295C"/><rect x="1080" y="240" width="130" height="26" rx="13" fill="#3DD68C"/><line x1="1210" y1="226" x2="1210" y2="280" stroke="#FFB020" stroke-width="3"/><text x="1080" y="306" font-family="Arial" font-size="14" font-weight="400" fill="#8A93B8" text-anchor="start">0.0</text><text x="1210" y="306" font-family="Arial" font-size="14" font-weight="700" fill="#FFB020" text-anchor="middle">0.5</text><text x="1600" y="306" font-family="Arial" font-size="14" font-weight="400" fill="#8A93B8" text-anchor="end">2.0</text><text x="1142.4" y="218" font-family="Arial" font-size="14" font-weight="700" fill="#3DD68C" text-anchor="middle">same person</text><text x="1402.4" y="218" font-family="Arial" font-size="14" font-weight="400" fill="#8A93B8" text-anchor="middle">someone else</text><text x="1080" y="344" font-family="Arial" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">maxDistance = 0.5 is the whole judgement call.</text><text x="1080" y="370" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">Lower it and one person splits into several.</text><text x="1080" y="394" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">Raise it and two people merge into one.</text><rect x="1040" y="440" width="600" height="290" rx="14" fill="#1A2350" stroke="#FFB020" stroke-width="2"/><text x="1068" y="486" font-family="Arial" font-size="20" font-weight="700" fill="#FFB020" text-anchor="start">WHY 512 AND NOT 3?</text><text x="1068" y="528" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">Three numbers could describe a face roughly — and</text><text x="1068" y="553" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">would collide constantly, because millions of</text><text x="1068" y="578" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">different faces would round to the same three</text><text x="1068" y="603" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">values.</text><text x="1068" y="640" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">512 gives the model enough room that two different</text><text x="1068" y="665" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">people almost never land in the same spot, while</text><text x="1068" y="690" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">the same person under different light still lands</text><text x="1068" y="715" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">close.</text><rect x="60" y="770" width="1580" height="120" rx="14" fill="#141B3E" stroke="#3DD68C" stroke-width="2"/><text x="92" y="816" font-family="Arial" font-size="19" font-weight="700" fill="#3DD68C" text-anchor="start">The vectors are normalised to length 1 — every face sits on the surface of a sphere.</text><text x="92" y="852" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">So "how similar are these two faces" collapses to "what is the angle between these two arrows" — a single number, and one a database index can search on.</text></svg>