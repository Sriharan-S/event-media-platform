<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950"><rect width="1700" height="950" fill="#0E1330"/><text x="60" y="62" font-family="Arial" font-size="26" font-weight="400" fill="#8A93B8" text-anchor="start">One codebase, two deployables — and only one of them costs money by the second</text><rect x="60" y="100" width="300" height="470" rx="14" fill="#141B3E" stroke="#33407F" stroke-width="2"/><text x="85" y="145" font-family="Arial" font-size="17" font-weight="700" fill="#8A93B8" text-anchor="start">CLIENTS</text><rect x="85" y="175" width="250" height="78" rx="10" fill="#141B3E" stroke="#33407F" stroke-width="2"/><text x="210" y="220.3" font-family="Arial" font-size="18" font-weight="700" fill="#A9BEFF" text-anchor="middle"></text><text x="105" y="208" font-family="Arial" font-size="17" font-weight="400" fill="#A9BEFF" text-anchor="start">Organiser dashboard</text><text x="105" y="230.95" font-family="Arial" font-size="17" font-weight="400" fill="#A9BEFF" text-anchor="start">SvelteKit SPA</text><rect x="85" y="275" width="250" height="78" rx="10" fill="#141B3E" stroke="#33407F" stroke-width="2"/><text x="210" y="320.3" font-family="Arial" font-size="18" font-weight="700" fill="#A9BEFF" text-anchor="middle"></text><text x="105" y="308" font-family="Arial" font-size="17" font-weight="400" fill="#A9BEFF" text-anchor="start">Participant</text><text x="105" y="330.95" font-family="Arial" font-size="17" font-weight="400" fill="#A9BEFF" text-anchor="start">/e/{slug} selfie form</text><rect x="85" y="375" width="250" height="78" rx="10" fill="#141B3E" stroke="#33407F" stroke-width="2"/><text x="210" y="420.3" font-family="Arial" font-size="18" font-weight="700" fill="#A9BEFF" text-anchor="middle"></text><text x="105" y="408" font-family="Arial" font-size="17" font-weight="400" fill="#A9BEFF" text-anchor="start">Personal gallery</text><text x="105" y="430.95" font-family="Arial" font-size="17" font-weight="400" fill="#A9BEFF" text-anchor="start">/g/{token}</text><rect x="430" y="100" width="570" height="470" rx="14" fill="#1A2350" stroke="#4C6FFF" stroke-width="2"/><text x="460" y="145" font-family="Arial" font-size="17" font-weight="700" fill="#4C6FFF" text-anchor="start">API HOST — Render  ·  always on  ·  no GPU</text><rect x="460" y="175" width="510" height="78" rx="10" fill="#141B3E" stroke="#33407F" stroke-width="2"/><text x="482" y="207" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">NestJS REST API</text><text x="482" y="233" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">auth · uploads · events · admin</text><rect x="460" y="271" width="510" height="78" rx="10" fill="#141B3E" stroke="#33407F" stroke-width="2"/><text x="482" y="303" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">ingest workers + cron</text><text x="482" y="329" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">clustering · sweeps · retention</text><rect x="460" y="367" width="510" height="78" rx="10" fill="#141B3E" stroke="#33407F" stroke-width="2"/><text x="482" y="399" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">GpuLifecycleSweep</text><text x="482" y="425" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">runs every 2 minutes</text><rect x="460" y="463" width="510" height="78" rx="10" fill="#141B3E" stroke="#33407F" stroke-width="2"/><text x="482" y="495" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">JarvisLabsRepository</text><text x="482" y="521" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">spawns the  jl  CLI as a child process</text><rect x="1070" y="100" width="570" height="470" rx="14" fill="#1A2350" stroke="#FFB020" stroke-width="2"/><text x="1100" y="145" font-family="Arial" font-size="17" font-weight="700" fill="#FFB020" text-anchor="start">GPU HOST — JarvisLabs  ·  on demand  ·  billed per second</text><rect x="1100" y="185" width="510" height="96" rx="10" fill="#141B3E" stroke="#33407F" stroke-width="2"/><text x="1122" y="223" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">backend-worker</text><text x="1122" y="251" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">same image, EL_WORKERS_INCLUDE=media</text><rect x="1100" y="305" width="510" height="96" rx="10" fill="#141B3E" stroke="#33407F" stroke-width="2"/><text x="1122" y="343" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">ml sidecar (CUDA)</text><text x="1122" y="371" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">RetinaFace detect + ArcFace embed</text><rect x="1100" y="425" width="510" height="96" rx="10" fill="#141B3E" stroke="#33407F" stroke-width="2"/><text x="1122" y="463" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">gpu-autoshutdown.sh</text><text x="1122" y="491" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">polls the API, kills the box itself</text><line x1="365" y1="280" x2="412.4" y2="280" stroke="#A9BEFF" stroke-width="3" stroke-linecap="round"/><polygon points="425,280 412.4,286.3 412.4,273.7" fill="#A9BEFF"/><text x="395" y="262" font-family="Arial" font-size="14" font-weight="400" fill="#8A93B8" text-anchor="middle">HTTPS</text><line x1="1065" y1="500" x2="1017.6" y2="500" stroke="#3DD68C" stroke-width="3" stroke-linecap="round"/><polygon points="1005,500 1017.6,493.7 1017.6,506.3" fill="#3DD68C"/><text x="1035" y="482" font-family="Arial" font-size="14" font-weight="400" fill="#3DD68C" text-anchor="middle">heartbeat</text><path d="M 1005 636 L 1180 636 L 1180 590" fill="none" stroke="#FFB020" stroke-width="3" stroke-dasharray="10 8"/><line x1="1180" y1="600" x2="1180" y2="590.6" stroke="#FFB020" stroke-width="3" stroke-linecap="round"/><polygon points="1180,578 1186.3,590.6 1173.7,590.6" fill="#FFB020"/><text x="1008" y="672" font-family="Arial" font-size="17" font-weight="700" fill="#FFB020" text-anchor="start">jl resume  /  jl pause</text><text x="1008" y="697" font-family="Arial" font-size="17" font-weight="700" fill="#FFB020" text-anchor="start">JarvisLabs ships no REST API — so this is a subprocess</text><rect x="60" y="690" width="1580" height="190" rx="14" fill="#141B3E" stroke="#33407F" stroke-width="2" stroke-dasharray="6 6"/><text x="90" y="730" font-family="Arial" font-size="17" font-weight="700" fill="#8A93B8" text-anchor="start">SHARED SERVICES — the seam that lets the GPU box come and go</text><rect x="90" y="752" width="484" height="100" rx="10" fill="#1A2350" stroke="#33407F" stroke-width="2"/><text x="114" y="790" font-family="Arial" font-size="20" font-weight="700" fill="#A9BEFF" text-anchor="start">Postgres + pgvector</text><text x="114" y="820" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">512-d face vectors, event-scoped</text><rect x="602" y="752" width="484" height="100" rx="10" fill="#1A2350" stroke="#33407F" stroke-width="2"/><text x="626" y="790" font-family="Arial" font-size="20" font-weight="700" fill="#A9BEFF" text-anchor="start">Redis + BullMQ</text><text x="626" y="820" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">the job queue — the real decoupler</text><rect x="1114" y="752" width="484" height="100" rx="10" fill="#1A2350" stroke="#33407F" stroke-width="2"/><text x="1138" y="790" font-family="Arial" font-size="20" font-weight="700" fill="#A9BEFF" text-anchor="start">Cloudflare R2</text><text x="1138" y="820" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">originals, previews, thumbnails</text><line x1="715" y1="575" x2="715" y2="732.4" stroke="#4C6FFF" stroke-width="3" stroke-linecap="round"/><polygon points="715,745 708.7,732.4 721.3,732.4" fill="#4C6FFF"/><text x="730" y="660" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">enqueue</text><line x1="1560" y1="575" x2="1560" y2="732.4" stroke="#FFB020" stroke-width="3" stroke-linecap="round"/><polygon points="1560,745 1553.7,732.4 1566.3,732.4" fill="#FFB020"/><text x="1548" y="645" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="end">pull jobs,</text><text x="1548" y="668" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="end">write results</text></svg>