<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950"><rect width="1700" height="950" fill="#0E1330"/><text x="60" y="60" font-family="Arial" font-size="26" font-weight="400" fill="#8A93B8" text-anchor="start">Faces are never grouped in one big pass — each one decides for itself, one at a time</text><rect x="120" y="130" width="620" height="100" rx="14" fill="#1A2350" stroke="#4C6FFF" stroke-width="2"/><text x="150" y="172" font-family="Arial" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start">A new face arrives</text><text x="150" y="204" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">It has an embedding and no person yet.</text><line x1="430" y1="234" x2="430" y2="243.4" stroke="#33407F" stroke-width="3" stroke-linecap="round"/><polygon points="430,256 423.7,243.4 436.3,243.4" fill="#33407F"/><rect x="120" y="260" width="620" height="100" rx="14" fill="#1A2350" stroke="#4C6FFF" stroke-width="2"/><text x="150" y="302" font-family="Arial" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start">Search its neighbours</text><text x="150" y="334" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">Every face in THIS EVENT within 0.5 cosine distance.</text><line x1="430" y1="364" x2="430" y2="373.4" stroke="#33407F" stroke-width="3" stroke-linecap="round"/><polygon points="430,386 423.7,373.4 436.3,373.4" fill="#33407F"/><rect x="120" y="390" width="620" height="100" rx="14" fill="#141B3E" stroke="#FFB020" stroke-width="3"/><text x="430" y="436" font-family="Arial" font-size="20" font-weight="700" fill="#FFB020" text-anchor="middle">Did any neighbour already belong to a person?</text><text x="430" y="466" font-family="Arial" font-size="14" font-weight="400" fill="#8A93B8" text-anchor="middle" font-style="italic">this is the entire decision</text><path d="M 300 490 L 300 550 L 240 550" fill="none" stroke="#3DD68C" stroke-width="3"/><line x1="240" y1="550" x2="240" y2="569.4" stroke="#3DD68C" stroke-width="3" stroke-linecap="round"/><polygon points="240,582 233.7,569.4 246.3,569.4" fill="#3DD68C"/><text x="310" y="536" font-family="Arial" font-size="17" font-weight="700" fill="#3DD68C" text-anchor="start">YES</text><rect x="60" y="590" width="360" height="130" rx="14" fill="#1A2350" stroke="#3DD68C" stroke-width="2"/><text x="90" y="632" font-family="Arial" font-size="20" font-weight="700" fill="#3DD68C" text-anchor="start">Join that person</text><text x="90" y="666" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">No new person is created. The face</text><text x="90" y="688" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">is simply assigned.</text><path d="M 560 490 L 560 550 L 620 550" fill="none" stroke="#4C6FFF" stroke-width="3"/><line x1="620" y1="550" x2="620" y2="569.4" stroke="#4C6FFF" stroke-width="3" stroke-linecap="round"/><polygon points="620,582 613.7,569.4 626.3,569.4" fill="#4C6FFF"/><text x="500" y="536" font-family="Arial" font-size="17" font-weight="700" fill="#4C6FFF" text-anchor="end">NO</text><rect x="440" y="590" width="360" height="130" rx="14" fill="#1A2350" stroke="#4C6FFF" stroke-width="2"/><text x="470" y="632" font-family="Arial" font-size="20" font-weight="700" fill="#4C6FFF" text-anchor="start">Create a new person</text><text x="470" y="666" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">This face becomes the first member</text><text x="470" y="688" font-family="Arial" font-size="15" font-weight="400" fill="#8A93B8" text-anchor="start">of a brand new cluster.</text><text x="120" y="905" font-family="Arial" font-size="18" font-weight="400" fill="#A9BEFF" text-anchor="start" font-style="italic">A "person" is not detected. It is what is left over once every face has answered that one question.</text><rect x="880" y="130" width="760" height="250" rx="14" fill="#1A2350" stroke="#FFB020" stroke-width="2"/><text x="910" y="178" font-family="Arial" font-size="21" font-weight="700" fill="#FFB020" text-anchor="start">SAFEGUARD 1 — the two-pass trick</text><text x="910" y="216" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">Faces are processed as they arrive, so an early face can be compared</text><text x="910" y="241" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">against neighbours whose embeddings do not exist yet. A face with too few</text><text x="910" y="266" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">neighbours is deferred and run again after the confident ones have</text><text x="910" y="291" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">finished creating people.</text><text x="910" y="350" font-family="Arial" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Order of arrival must not decide who you are.</text><rect x="880" y="410" width="760" height="205" rx="14" fill="#1A2350" stroke="#3DD68C" stroke-width="2"/><text x="910" y="458" font-family="Arial" font-size="21" font-weight="700" fill="#3DD68C" text-anchor="start">SAFEGUARD 2 — minFaces</text><text x="910" y="496" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">How many faces must agree before a cluster is allowed to exist. Default 1,</text><text x="910" y="521" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">because at a small event a genuine guest may appear exactly once. Raise it</text><text x="910" y="546" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">per event when single-photo people get noisy.</text><rect x="880" y="650" width="760" height="210" rx="14" fill="#141B3E" stroke="#FF7AA8" stroke-width="2"/><text x="910" y="698" font-family="Arial" font-size="21" font-weight="700" fill="#FF7AA8" text-anchor="start">AND THE HARD BOUNDARY</text><text x="910" y="736" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">Every one of these searches is scoped to a single event id, in the query</text><text x="910" y="761" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">itself. A face from last month's wedding is not merely filtered out of the</text><text x="910" y="786" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="start">results — it was never a candidate.</text></svg>