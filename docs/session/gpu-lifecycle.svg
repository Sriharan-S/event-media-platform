<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950"><rect width="1700" height="950" fill="#0E1330"/><text x="60" y="62" font-family="Arial" font-size="26" font-weight="400" fill="#8A93B8" text-anchor="start">The decision loop: never idle, never cut a batch short</text><rect x="620" y="140" width="460" height="150" rx="14" fill="#1A2350" stroke="#8A93B8" stroke-width="3"/><text x="850" y="202" font-family="Arial" font-size="34" font-weight="700" fill="#8A93B8" text-anchor="middle">OFF</text><text x="850" y="240" font-family="Arial" font-size="17" font-weight="400" fill="#8A93B8" text-anchor="middle">paused · no compute billing · storage kept</text><rect x="1120" y="400" width="460" height="150" rx="14" fill="#1A2350" stroke="#FFB020" stroke-width="3"/><text x="1350" y="462" font-family="Arial" font-size="34" font-weight="700" fill="#FFB020" text-anchor="middle">STARTING</text><text x="1350" y="500" font-family="Arial" font-size="17" font-weight="400" fill="#8A93B8" text-anchor="middle">jl resume · minutes, not seconds</text><rect x="620" y="630" width="460" height="150" rx="14" fill="#1A2350" stroke="#3DD68C" stroke-width="3"/><text x="850" y="692" font-family="Arial" font-size="34" font-weight="700" fill="#3DD68C" text-anchor="middle">RUNNING</text><text x="850" y="730" font-family="Arial" font-size="17" font-weight="400" fill="#8A93B8" text-anchor="middle">draining the GPU queues</text><rect x="120" y="400" width="460" height="150" rx="14" fill="#1A2350" stroke="#4C6FFF" stroke-width="3"/><text x="350" y="462" font-family="Arial" font-size="34" font-weight="700" fill="#4C6FFF" text-anchor="middle">STOPPING</text><text x="350" y="500" font-family="Arial" font-size="17" font-weight="400" fill="#8A93B8" text-anchor="middle">jl pause · then verify</text><line x1="1080" y1="220" x2="1192.7905118900965" y2="381.6664003758051" stroke="#FFB020" stroke-width="4" stroke-linecap="round"/><polygon points="1200,392 1187.623712077999,385.2711444307568 1197.957311702194,378.0616563208534" fill="#FFB020"/><text x="1150" y="200" font-family="Arial" font-size="17" font-weight="400" fill="#FFB020" text-anchor="start">pending ≥ 25</text><text x="1150" y="224" font-family="Arial" font-size="17" font-weight="400" fill="#FFB020" text-anchor="start">OR oldest job waited 120 min</text><text x="1150" y="248" font-family="Arial" font-size="17" font-weight="400" fill="#FFB020" text-anchor="start">OR operator hit "Process all"</text><line x1="1250" y1="558" x2="1100.6246626955224" y2="653.2267775316045" stroke="#3DD68C" stroke-width="4" stroke-linecap="round"/><polygon points="1090,660 1097.2380514613246,647.9144461838433 1104.0112739297201,658.5391088793657" fill="#3DD68C"/><text x="1290" y="646" font-family="Arial" font-size="17" font-weight="400" fill="#3DD68C" text-anchor="start">box reports in</text><line x1="620" y1="668" x2="509.2881421665293" y2="566.5141303193186" stroke="#4C6FFF" stroke-width="4" stroke-linecap="round"/><polygon points="500,558 513.5452073261886,561.870059236054 505.03107700687,571.1582014025832" fill="#4C6FFF"/><text x="150" y="700" font-family="Arial" font-size="17" font-weight="400" fill="#4C6FFF" text-anchor="start">queues quiet for 10 min</text><text x="150" y="724" font-family="Arial" font-size="17" font-weight="400" fill="#4C6FFF" text-anchor="start">(active jobs older than 30 min</text><text x="150" y="748" font-family="Arial" font-size="17" font-weight="400" fill="#4C6FFF" text-anchor="start">are orphans, not work)</text><line x1="430" y1="392" x2="552.4026497039742" y2="230.05187885320336" stroke="#8A93B8" stroke-width="4" stroke-linecap="round"/><polygon points="560,220 557.4285891305759,233.85055400121627 547.3767102773726,226.25320370519046" fill="#8A93B8"/><text x="300" y="300" font-family="Arial" font-size="17" font-weight="400" fill="#8A93B8" text-anchor="start">provider confirms paused</text><path d="M 1580 400 L 1650 400 L 1650 120 L 1080 120" fill="none" stroke="#33407F" stroke-width="3" stroke-dasharray="8 6"/><text x="1400" y="100" font-family="Arial" font-size="16" font-weight="400" fill="#8A93B8" text-anchor="middle">never reported in after 20 min → give up, stop</text><rect x="660" y="400" width="380" height="150" rx="14" fill="#141B3E" stroke="#33407F" stroke-width="2" stroke-dasharray="6 6"/><text x="850" y="450" font-family="Arial" font-size="22" font-weight="700" fill="#A9BEFF" text-anchor="middle">SWEEP</text><text x="850" y="482" font-family="Arial" font-size="17" font-weight="400" fill="#8A93B8" text-anchor="middle">every 2 minutes</text><text x="850" y="518" font-family="Arial" font-size="17" font-weight="400" fill="#8A93B8" text-anchor="middle">start · stop · do nothing</text><rect x="60" y="820" width="1580" height="110" rx="14" fill="#1A2350" stroke="#3DD68C" stroke-width="3"/><text x="92" y="862" font-family="Arial" font-size="21" font-weight="700" fill="#3DD68C" text-anchor="start">BACKSTOP — the expensive resource fails closed</text><text x="92" y="896" font-family="Arial" font-size="17" font-weight="400" fill="#8A93B8" text-anchor="start">The box polls GET /api/webhooks/gpu/heartbeat. If the API says stop — or is simply unreachable — the box shuts itself down. A failed pause is not a runaway bill.</text></svg>