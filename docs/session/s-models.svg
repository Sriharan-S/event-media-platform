0 0 1 26 0" fill="none" stroke="#2A1B3D" stroke-width="2.4"/><circle cx="1260" cy="476.85" r="7.15" fill="none" stroke="#2A1B3D" stroke-width="2.4"/><path d="M 1247 498.95 a 13 12.35 0 0 1 26 0" fill="none" stroke="#2A1B3D" stroke-width="2.4"/><circle cx="1302" cy="476.85" r="7.15" fill="none" stroke="#2A1B3D" stroke-width="2.4"/><path d="M 1289 498.95 a 13 12.35 0 0 1 26 0" fill="none" stroke="#2A1B3D" stroke-width="2.4"/><circle cx="1344" cy="476.85" r="7.15" fill="none" stroke="#2A1B3D" stroke-width="2.4"/><path d="M 1331 498.95 a 13 12.35 0 0 1 26 0" fill="none" stroke="#2A1B3D" stroke-width="2.4"/><circle cx="1386" cy="476.85" r="7.15" fill="none" stroke="#2A1B3D" stroke-width="2.4"/><path d="M 1373 498.95 a 13 12.35 0 0 1 26 0" fill="none" stroke="#2A1B3D" stroke-width="2.4"/><circle cx="1428" cy="476.85" r="7.15" fill="none" stroke="#2A1B3D" stroke-width="2.4"/><path d="M 1415 498.95 a 13 12.35 0 0 1 26 0" fill="none" stroke="#2A1B3D" stroke-width="2.4"/><circle cx="1470" cy="476.85" r="7.15" fill="none" stroke="#2A1B3D" stroke-width="2.4"/><path d="M 1457 498.95 a 13 12.35 0 0 1 26 0" fill="none" stroke="#2A1B3D" stroke-width="2.4"/><circle cx="1512" cy="476.85" r="7.15" fill="none" stroke="#2A1B3D" stroke-width="2.4"/><path d="M 1499 498.95 a 13 12.35 0 0 1 26 0" fill="none" stroke="#2A1B3D" stroke-width="2.4"/><circle cx="1554" cy="476.85" r="7.15" fill="none" stroke="#2A1B3D" stroke-width="2.4"/><path d="M 1541 498.95 a 13 12.35 0 0 1 26 0" fill="none" stroke="#2A1B3D" stroke-width="2.4"/><rect x="1186" y="516" width="84.80000000000001" height="30" rx="15" fill="#2E7D77" opacity="0.16"/><text x="1228.4" y="537" font-family="Arial" font-size="14" font-weight="700" fill="#2E7D77" text-anchor="middle">concert</text><rect x="1279.8" y="516" width="126.80000000000001" height="30" rx="15" fill="#2E7D77" opacity="0.16"/><text x="1343.2" y="537" font-family="Arial" font-size="14" font-weight="700" fill="#2E7D77" text-anchor="middle">stage lights</text><rect x="1415.6" y="516" width="68" height="30" rx="15" fill="#2E7D77" opacity="0.16"/><text x="1449.6" y="537" font-family="Arial" font-size="14" font-weight="700" fill="#2E7D77" text-anchor="middle">crowd</text><rect x="1492.6" y="516" width="68" height="30" rx="15" fill="#2E7D77" opacity="0.16"/><text x="1526.6" y="537" font-family="Arial" font-size="14" font-weight="700" fill="#2E7D77" text-anchor="middle">night</text><text x="1172" y="602" font-family="Arial" font-size="12" font-weight="700" fill="#7C6B84" text-anchor="start" letter-spacing="1.5">IN</text><text x="1214" y="602" font-family="Arial" font-size="16" font-weight="400" fill="#2A1B3D" text-anchor="start">the whole photograph again</text><text x="1172" y="632" font-family="Arial" font-size="12" font-weight="700" fill="#7C6B84" text-anchor="start" letter-spacing="1.5">OUT</text><text x="1214" y="632" font-family="Arial" font-size="16" font-weight="400" fill="#2A1B3D" text-anchor="start">512 numbers describing the scene —</text><text x="1214" y="656" font-family="Arial" font-size="16" font-weight="400" fill="#2A1B3D" text-anchor="start">powers “show me similar photos”</text><rect x="60" y="800" width="1580" height="100" rx="16" fill="#2A1B3D" stroke="none" stroke-width="2"/><text x="90" y="838" font-family="Arial" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">All three are pretrained and run inside one Python sidecar. We wrote none of the model code — we built the queues, the scoping, the storage, and the machine they run on.</text><text x="90" y="872" font-family="Arial" font-size="15" font-weight="400" fill="#C9BBD6" text-anchor="start">The interesting engineering is almost never inside the model — it is in what you let the model touch, and what you make it cost.</text></svg>